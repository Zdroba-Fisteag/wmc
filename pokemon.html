<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pokémon Encyclopedia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        .content {
            padding: 1%;
        }

        .pokemon-card {
            padding: 1%;
            width: 100%;
            display: block;
        }

        img {
            width: 15%;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <div class="content">
        <h1>Pokémon Encyclopedia</h1>

        <p>Search for a Pokémon by name or ID:</p>

        <form id="searchForm">
            <input type="text" id="pokemonInput" placeholder="Example: pikachu, aegislash, eternatus" required>
            <button type="submit">Search</button>
        </form>

        <hr style="padding: .1%; border: none;">

        <div id="result"></div>

        <script>
            const form = document.getElementById("searchForm");
            const input = document.getElementById("pokemonInput");
            const result = document.getElementById("result");

            form.addEventListener("submit", function (event) {
                event.preventDefault();

                let pokemonName = input.value.trim().toLowerCase();

                const pokemonAliases = {
                    "deoxys": "deoxys-normal",
                    "wormadam": "wormadam-plant",
                    "giratina": "giratina-altered",
                    "shaymin": "shaymin-land",
                    "basculin": "basculin-red-striped",
                    "darmanitan": "darmanitan-standard",
                    "tornadus": "tornadus-incarnate",
                    "thundurus": "thundurus-incarnate",
                    "landorus": "landorus-incarnate",
                    "keldeo": "keldeo-ordinary",
                    "meloetta": "meloetta-aria",
                    "aegislash": "aegislash-shield",
                    "pumpkaboo": "pumpkaboo-average",
                    "gourgeist": "gourgeist-average",
                    "zygarde": "zygarde-50",
                    "oricorio": "oricorio-baile",
                    "lycanroc": "lycanroc-midday",
                    "wishiwashi": "wishiwashi-solo",
                    "minior": "minior-red-meteor",
                    "mimikyu": "mimikyu-disguised",
                    "toxtricity": "toxtricity-amped",
                    "eiscue": "eiscue-ice",
                    "indeedee": "indeedee-male",
                    "morpeko": "morpeko-full-belly",
                    "urshifu": "urshifu-single-strike",
                    "basculegion": "basculegion-male",
                    "enamorus": "enamorus-incarnate",
                    "oinkologne": "oinkologne-male",
                    "maushold": "maushold-family-of-four",
                    "squawkabilly": "squawkabilly-green-plumage",
                    "palafin": "palafin-zero",
                    "tatsugiri": "tatsugiri-curly",
                    "dudunsparce": "dudunsparce-two-segment"
                };

                pokemonName = pokemonAliases[pokemonName] || pokemonName;

                if (pokemonName === "") {
                    result.innerHTML = "<p class='error'>Please enter a Pokémon name.</p>";
                    return;
                }

                fetchPokemon(pokemonName);
            });

            async function fetchPokemon(name) {
                result.innerHTML = "<p>Loading Pokémon data...</p>";

                try {
                    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);

                    if (!response.ok) {
                        throw new Error("Pokémon not found");
                    }

                    const pokemon = await response.json();

                    displayPokemon(pokemon);

                } catch (error) {
                    result.innerHTML = `
                    <p class="error">
                        Pokémon not found. Please check the spelling.
                    </p>
                `;
                }
            }

            function displayPokemon(pokemon) {
                const name = capitalizeFirstLetter(pokemon.name);

                const sprite = pokemon.sprites.other["official-artwork"].front_default
                    || pokemon.sprites.front_default;

                const types = pokemon.types
                    .map(typeInfo => typeInfo.type.name)
                    .join(", ");

                const abilities = pokemon.abilities
                    .map(abilityInfo => abilityInfo.ability.name)
                    .join(", ");

                const stats = pokemon.stats
                    .map(statInfo => {
                        return `
                        <li>
                            ${statInfo.stat.name}: ${statInfo.base_stat}
                        </li>
                    `;
                    })
                    .join("");

                result.innerHTML = `
                <div class="pokemon-card">
                    <h2>${name}</h2>

                    <img src="${sprite}" alt="${name}">

                    <p><strong>ID:</strong> #${pokemon.id}</p>
                    <p><strong>Height:</strong> ${pokemon.height / 10} m</p>
                    <p><strong>Weight:</strong> ${pokemon.weight / 10} kg</p>
                    <p><strong>Type(s):</strong> ${types}</p>
                    <p><strong>Abilities:</strong> ${abilities}</p>

                    <h3>Base Stats</h3>
                    <ul>
                        ${stats}
                    </ul>
                </div>
            `;
            }

            function capitalizeFirstLetter(word) {
                return word.charAt(0).toUpperCase() + word.slice(1);
            }
        </script>
    </div>
</body>

</html>
